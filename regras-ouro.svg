  <ellipse cx="137" cy="570" rx="10" ry="13" fill="#e27224"/>
  <ellipse cx="232" cy="570" rx="10" ry="13" fill="#e27224"/>
  <path d="M160,598 q23,-18 46,0" fill="none" stroke="#e27224" stroke-width="9" stroke-linecap="round"/>

  <!-- Cadeado com etiqueta (direita superior) -->
