  <path d="M42,1250 L1510,1250 L1512,1292 L42,1292 Z" fill="#2a2bd1"/>
  <path d="M42,1290 L1508,1290 C1480,1420 1400,1560 1345,1640 C1320,1665 1300,1668 1290,1668 L262,1668 C240,1668 215,1655 205,1635 C150,1550 70,1400 42,1290 Z" fill="#3bb5e4"/>
