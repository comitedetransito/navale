  <rect x="0" y="725" width="410" height="34" rx="8" fill="#e394c6"/>
  <rect x="0" y="760" width="410" height="490" rx="10" fill="#bd3260"/>
  <rect x="1142" y="725" width="410" height="34" rx="8" fill="#e394c6"/>
  <rect x="1142" y="760" width="410" height="490" rx="10" fill="#bd3260"/>

