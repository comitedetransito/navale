<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1552 2000" role="img" aria-label="10 Regras de Ouro da Segurança">
  <title>10 Regras de Ouro da Segurança</title>

  <!-- Faixa amarela superior (pico) -->
  <path d="M408,330 C470,300 560,250 640,140 C700,50 740,0 775,0 C810,0 850,50 910,140 C990,250 1080,300 1150,330 L1150,620 L408,620 Z" fill="#ffdc8f"/>
