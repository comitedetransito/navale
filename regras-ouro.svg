  <path d="M232,1440 v-40 a28,28 0 0 1 56,0 v40" fill="none" stroke="#3bb5e4" stroke-width="10"/>
  <circle cx="257" cy="1465" r="8" fill="#ffffff"/>
  <rect x="253" y="1470" width="8" height="25" fill="#ffffff"/>
  <circle cx="1305" cy="1400" r="30" fill="#ffffff"/>
  <rect x="1288" y="1420" width="36" height="120" rx="12" fill="#ffffff"/>
  <rect x="1352" y="1450" width="34" height="88" rx="8" fill="#ffffff"/>
  <rect x="1362" y="1372" width="14" height="80" fill="#ffffff"/>
  <rect x="530" y="1768" width="92" height="118" rx="8" fill="#ffffff"/>
  <rect x="568" y="1785" width="14" height="65" fill="#0bbb99"/>
  <circle cx="576" cy="1858" r="9" fill="#0bbb99"/>
  <rect x="958" y="1768" width="66" height="118" rx="8" fill="#ffffff"/>
  <circle cx="990" cy="1870" r="8" fill="#0bbb99"/>
  <path d="M1048,1795 L1025,1820 L1040,1840 L1020,1862 L1045,1885" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>

  <!-- Ícones da faixa superior -->
  <path d="M548,300 h60 v20 l-8,8 v150 q0,8 -8,8 h-36 q-8,0 -8,-8 v-150 l-8,-8z" fill="#ffffff"/>
  <ellipse cx="612" cy="418" rx="56" ry="28" fill="#ffffff"/>
  <line x1="955" y1="210" x2="985" y2="350" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1013" cy="326" r="18" fill="#ffffff"/>
