  <line x1="778" y1="70" x2="778" y2="340" stroke="#ffffff" stroke-width="4" stroke-dasharray="22 16"/>

  <!-- Asas laranja -->
  <rect x="58" y="405" width="350" height="40" fill="#f6b07a"/>
  <rect x="58" y="440" width="350" height="290" fill="#e27224"/>
  <rect x="1150" y="405" width="350" height="40" fill="#f6b07a"/>
  <rect x="1150" y="440" width="350" height="290" fill="#e27224"/>

