  <circle cx="1385" cy="600" r="45" fill="none" stroke="#ffffff" stroke-width="8"/>
  <rect x="1330" y="580" width="75" height="42" rx="8" fill="#ffffff" transform="rotate(-45 1367 601)"/>
  <circle cx="1385" cy="572" r="6" fill="#e27224"/>

  <!-- Içamento de carga (esquerda) -->
  <line x1="138" y1="865" x2="138" y2="935" stroke="#ffffff" stroke-width="6"/>
  <circle cx="138" cy="955" r="16" fill="none" stroke="#ffffff" stroke-width="6"/>
  <path d="M90,1012 L138,960 L185,1012" fill="none" stroke="#ffffff" stroke-width="6"/>
  <rect x="62" y="1012" width="150" height="85" rx="12" fill="none" stroke="#ffffff" stroke-width="8"/>
  <line x1="115" y1="1012" x2="115" y2="1097" stroke="#ffffff" stroke-width="6"/>

  <!-- Triângulo de atenção (direita) -->
  <path d="M1433,935 L1525,1080 Q1530,1095 1515,1095 L1352,1095 Q1338,1095 1345,1080 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="1415" cy="1000" r="13" fill="#ffffff"/>
  <path d="M1380,1065 L1400,1030 L1420,1030 L1420,1055 L1480,1055 L1485,1072 L1400,1072 Z" fill="#ffffff"/>

  <!-- Escudo branco externo -->
  <path d="M247,625 C520,600 650,520 775,375 C900,520 1030,600 1310,625 L1310,1150 C1280,1400 1080,1700 780,1820 C480,1700 275,1400 247,1150 Z" fill="#ffffff"/>
  <!-- Interior do escudo -->
  <path d="M305,675 C520,650 650,560 745,495 C850,600 1030,700 1225,745 L1225,1150 C1195,1360 1050,1580 780,1750 C510,1580 340,1360 305,1150 Z" fill="#d0d0d0"/>
  <path d="M305,752 C500,735 640,650 745,495 C850,600 1030,700 1225,745 L1225,1150 C1195,1360 1050,1580 780,1750 C510,1580 340,1360 305,1150 Z" fill="#e6e6e6"/>

  <!-- Título -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="128" fill="#07807a">
    <text x="420" y="945" textLength="600" lengthAdjust="spacingAndGlyphs">10 Regras</text>
    <text x="420" y="1130" textLength="695" lengthAdjust="spacingAndGlyphs">de Ouro da</text>
    <text x="420" y="1310" textLength="675" lengthAdjust="spacingAndGlyphs">Segurança</text>
  </g>
</svg>
